<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- Meta tags optimized for iPhone Safari full-screen app experience -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AirMac">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1c1c1e">
    <meta name="color-scheme" content="dark">
    <meta name="format-detection" content="telephone=no">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <title>AirMac</title>
    <link rel="stylesheet" href="/web/styles.css?v=16">
</head>
<body>
    <canvas id="matrixCanvas"></canvas>

    <div class="install-coach" id="install-coach" hidden role="status">
        <span id="install-coach-text">将 AirMac 添加到主屏幕，使用时更像原生 App。</span>
        <button type="button" id="install-coach-button">知道了</button>
    </div>

    <div class="pairing-overlay hidden" id="pairing-overlay">
        <div class="pairing-card">
            <h1 id="pairing-title">连接 AirMac</h1>
            <p id="pairing-description">为这台 iPhone 命名，然后在 Mac 上获取一次性验证码。</p>
            <input id="pairing-name" type="text" maxlength="40" value="iPhone" placeholder="设备名称" autocomplete="off" />
            <input id="pairing-code" class="hidden" type="text" maxlength="6" inputmode="numeric" pattern="[0-9]*" placeholder="000000" autocomplete="one-time-code" />
            <button id="pairing-button" type="button">在 Mac 上显示验证码</button>
            <div class="pairing-error" id="pairing-error"></div>
        </div>
    </div>

    <div class="container">
        <header class="app-header">
            <div class="brand"><strong>AirMac</strong><span>Remote Deck</span></div>
            <airmac-status id="connection-status"></airmac-status>
            <button type="button" class="icon-button language-button" id="language-toggle" aria-label="Switch to English">EN</button>
            <button type="button" class="icon-button" id="settings-button" aria-label="打开设置">⌘</button>
        </header>

        <main class="views">
            <section class="view active" id="pad-view" aria-label="触控板">
                <div id="trackpad">
                    <div class="etching">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="6" y="3" width="12" height="18" rx="6" ry="6"></rect>
                            <line x1="12" y1="7" x2="12" y2="11"></line>
                        </svg>
                        <span>TOUCH PAD</span>
                    </div>
                    <div class="touch-feedback" id="touch-feedback" aria-hidden="true"></div>
                    <div class="gesture-toast" id="gesture-toast" role="status"></div>
                    <div class="status-container">
                        <div class="spinner" id="status-spinner"></div>
                        <div class="hint" id="status-text"></div>
                    </div>
                </div>
            </section>

            <section class="view" id="deck-view" aria-label="快捷控制">
                <div class="deck-scroll"><airmac-deck id="quick-deck"></airmac-deck></div>
            </section>

            <section class="view" id="text-view" aria-label="文本输入">
                <div class="text-scroll">
                    <div class="text-card">
                        <h2 id="text-title">文本输入</h2>
                        <p id="text-description">长文本会作为一次完整投射发送；实时键盘适合短句和退格。</p>
                        <div class="projection-bar">
                            <div class="projection-input-wrap">
                                <textarea id="projection-input" rows="1" maxlength="32768" placeholder="输入长文本投射到 Mac…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
                                <button type="button" class="clear-btn" id="projection-clear" aria-label="清空长文本">×</button>
                            </div>
                            <button type="button" class="send-btn" id="projection-btn" aria-label="发送长文本">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="22" y1="2" x2="11" y2="13"></line>
                                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                </svg>
                            </button>
                        </div>
                        <button type="button" class="keyboard-button" id="keyboard-trigger">⌨︎ 打开实时键盘</button>
                    </div>
                </div>
            </section>
        </main>

        <footer class="bottom-shell">
            <nav class="bottom-nav" id="main-nav" aria-label="主要功能">
                <button type="button" class="nav-button active" data-view="pad"><span class="nav-icon">⌁</span><span class="nav-label">触控板</span></button>
                <button type="button" class="nav-button" data-view="deck"><span class="nav-icon">◫</span><span class="nav-label">快捷台</span></button>
                <button type="button" class="nav-button" data-view="text"><span class="nav-icon">⌨︎</span><span class="nav-label">文本</span></button>
            </nav>
            <div class="gesture-guide" id="gesture-guide" aria-label="手势提示">
                <span data-i18n="gesture-guide-one">单指移动/点击 · 双指滚动/右键</span>
                <span data-i18n="gesture-guide-two">三指左右切桌面 · 三/四指上滑调度/应用</span>
            </div>
        </footer>

        <input type="text" id="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
    </div>

    <div class="settings-overlay" id="settings-overlay" hidden>
      <section class="settings-dialog" id="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <form class="settings-form" id="settings-form">
            <div class="settings-head"><h2 id="settings-title">控制设置</h2><button type="button" class="settings-close" id="settings-close" aria-label="关闭设置">×</button></div>
            <div class="settings-body">
                <div class="setting-row">
                    <label class="setting-label" for="pointer-sensitivity"><span id="label-pointer-sensitivity">指针灵敏度</span><output id="pointer-value">1.6×</output></label>
                    <input id="pointer-sensitivity" type="range" min="0.6" max="3" step="0.1">
                </div>
                <div class="setting-row">
                    <label class="setting-label" for="scroll-speed"><span id="label-scroll-speed">滚动速度</span><output id="scroll-value">1.0×</output></label>
                    <input id="scroll-speed" type="range" min="0.5" max="3" step="0.1">
                </div>
                <div class="setting-row"><label class="setting-label toggle-row"><span id="label-natural-scroll">自然滚动方向</span><input id="natural-scroll" type="checkbox"></label></div>
                <div class="setting-row">
                    <label class="setting-label" for="three-finger-up"><span id="label-three-finger-up">三指上滑</span></label>
                    <select id="three-finger-up"><option value="mission_control">调度中心</option><option value="app_launcher">Apps 应用界面</option></select>
                </div>
                <div class="setting-row">
                    <label class="setting-label" for="four-finger-up"><span id="label-four-finger-up">四指上滑</span></label>
                    <select id="four-finger-up"><option value="app_launcher">Apps 应用界面</option><option value="mission_control">调度中心</option><option value="disabled">关闭</option></select>
                </div>
                <div class="setting-row"><label class="setting-label toggle-row"><span id="label-touch-feedback">触点反馈</span><input id="touch-feedback-setting" type="checkbox"></label></div>
                <div class="setting-row"><label class="setting-label toggle-row"><span id="label-reduce-motion">减少动态效果</span><input id="reduce-motion" type="checkbox"></label></div>
                <div class="setting-row"><label class="setting-label toggle-row"><span id="label-low-power">低功耗模式</span><input id="low-power" type="checkbox"></label></div>
            </div>
            <div class="settings-actions"><button type="button" id="settings-reset">恢复默认</button><button type="submit" class="primary" id="settings-save" value="save">保存</button></div>
        </form>
      </section>
    </div>

    <script src="/frontend_state.js?v=16"></script>
    <script src="/ui_components.js?v=16"></script>
    <script src="/web/i18n.js?v=16"></script>
    <script src="/web/settings.js?v=16"></script>
    <script src="/web/background.js?v=16"></script>
    <script src="/web/credentials.js?v=16"></script>
    <script src="/web/pairing.js?v=16"></script>
    <script src="/web/connection.js?v=16"></script>
    <script src="/web/projection.js?v=16"></script>
    <script src="/web/gestures.js?v=16"></script>
    <script src="/web/locale.js?v=16"></script>
    <script src="/web/app.js?v=16"></script>
</body>
</html>
