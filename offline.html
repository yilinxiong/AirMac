<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1c1c1e">
    <title>AirMac 暂时不可用</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            min-height: 100svh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 28px;
            color: #fff;
            background: radial-gradient(circle at 50% 20%, #26394a 0, #1c1c1e 45%, #101012 100%);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            text-align: center;
        }
        main {
            width: min(100%, 360px);
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
        }
        img { width: 88px; height: 88px; border-radius: 20px; }
        h1 { margin: 20px 0 10px; font-size: 24px; }
        p { margin: 0 0 24px; color: rgba(255, 255, 255, 0.68); line-height: 1.5; }
        button {
            width: 100%;
            padding: 14px 18px;
            border: 0;
            border-radius: 14px;
            color: white;
            background: #0a84ff;
            font: inherit;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="AirMac">
        <h1>暂时连不上 Mac</h1>
        <p>请确认 Mac 已唤醒、AirMac 后台服务正在运行，并且手机仍在同一个局域网。</p>
        <button type="button" onclick="location.reload()">重新连接</button>
    </main>
</body>
</html>
