name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python tests
        run: python -m pytest -q
      - name: Frontend tests
        run: node --test tests/*.test.js
      - name: Static checks
        run: |
          python -m compileall -q main.py auth.py protocol.py airmac_version.py config.py diagnostics.py connection.py sessions.py transport.py websocket_transport.py web_assets.py mac_controller.py controller_services manage_devices.py pairing_dialog.py tests
          for file in frontend_state.js ui_components.js service-worker.js web/*.js; do node --check "$file"; done
          python -m json.tool manifest.webmanifest >/dev/null
          bash -n install_service.sh uninstall_service.sh tools/generate_pwa_icons.sh
          python -m pip check
      - name: Build native menu-bar manager
        if: runner.os == 'macOS'
        run: clang -fobjc-arc -framework Cocoa menubar.m -o /tmp/airmac-menubar-check
      - name: Build audio output switcher
        if: runner.os == 'macOS'
        run: clang -fobjc-arc -framework Foundation -framework CoreAudio audio_switcher.m -o /tmp/airmac-audio-switcher-check
