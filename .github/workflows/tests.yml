name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python tests
        run: python -m pytest -q
      - name: Frontend state tests
        run: node --test tests/frontend_state.test.js
      - name: Static checks
        run: |
          python -m compileall -q main.py auth.py protocol.py mac_controller.py manage_devices.py pairing_dialog.py tests
          sed -n '/^[[:space:]]*<script>$/,/^[[:space:]]*<\/script>$/p' index.html | sed '1d;$d' | node --check -
          node --check service-worker.js
          python -m json.tool manifest.webmanifest >/dev/null
          bash -n install_service.sh uninstall_service.sh tools/generate_pwa_icons.sh
          python -m pip check
      - name: Build native menu-bar manager
        if: runner.os == 'macOS'
        run: clang -fobjc-arc -framework Cocoa menubar.m -o /tmp/airmac-menubar-check
